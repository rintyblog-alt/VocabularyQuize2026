*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans','Noto Sans JP',sans-serif;background:#f3f4f6;}
.ms{font-family:"Material Symbols Rounded";font-weight:500;font-style:normal;font-size:20px;line-height:1;display:inline-block;letter-spacing:normal;text-transform:none;white-space:nowrap;word-wrap:normal;direction:ltr;font-feature-settings:"liga";-webkit-font-smoothing:antialiased;}

<script>
(function(){

var slides=[
/* ═══════════════════════════════════════════════
   SLIDE 1 — AI Chat Experience
   ═══════════════════════════════════════════════ */
{

  onMount:function(){

    setTimeout(function(){var i=0;var t=setInterval(function(){if(i<MSG.length){typed.textContent+=MSG[i++];}else{clearInterval(t);
      setTimeout(function(){send.style.transform="scale(0.8)";send.style.background="#5c4be8";
        setTimeout(function(){send.style.transform="scale(1)";
          setTimeout(function(){screen.style.transform="scale(1) translateY(0)";cursor.style.opacity="0";typed.textContent="";
            setTimeout(function(){msgs.innerHTML="";
              /* User msg — real UI: icon left, plain text right, no bubble */

              msgs.appendChild(ub);setTimeout(function(){ub.style.opacity="1";},50);
              /* Thinking dots */
              setTimeout(function(){var tb=document.createElement("div");tb.style.cssText="display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start;opacity:0;transition:opacity 0.3s;";

                setTimeout(function(){tb.remove();var ab=document.createElement("div");ab.style.cssText="display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start;opacity:0;transition:opacity 0.3s;";

                  requestAnimationFrame(tick);

              },600);
            },500);
          },400);
        },200);
      },300);

/* Animation durations per slide (ms) — controls appear after this */
var SLIDE_ANIM_MS=[8000,3200,8500,6500,7000,0];

function showControls(){var c=document.getElementById("vqObControls");if(c)c.style.opacity="1";}
function hideControls(){var c=document.getElementById("vqObControls");if(c)c.style.opacity="0";}

function renderSlide(idx){
  var ct=document.getElementById("vqObSlideContainer");if(!ct)return;
  hideControls();
  ct.style.opacity="0";ct.style.transform="translateY(10px)";ct.style.transition="all 0.25s";
  setTimeout(function(){
    ct.innerHTML=slides[idx].render();
    if(slides[idx].onMount)slides[idx].onMount();
    ct.style.opacity="1";ct.style.transform="translateY(0)";
    document.querySelectorAll(".vq-ob-dot").forEach(function(d,i){d.style.width=i===idx?"24px":"8px";d.style.background=i===idx?"#5c4be8":"#e5e7eb";});
    /* Show controls after animation finishes (or immediately for slide 5) */
    var delay=SLIDE_ANIM_MS[idx]||0;
    if(idx===slides.length-1){delay=0;}/* Slide 5 has its own button */
    if(delay>0){setTimeout(showControls,delay);}else if(idx<slides.length-1){showControls();}
    var nb=document.getElementById("vqObNextBtn");
    if(nb){
      if(idx===slides.length-1){nb.style.display="none";}
      else{nb.style.display="";nb.textContent="次へ →";}
    }
  },250);
}

window.finishOnboarding=function(){
  var o=document.getElementById("onboarding-overlay");if(!o)return;
  o.style.transition="opacity 1s ease,transform 1s ease";o.style.opacity="0";o.style.transform="scale(1.05)";
  setTimeout(function(){o.remove();},1000);
};

document.getElementById("vqObNextBtn").onclick=function(){if(curSlide<slides.length-1){curSlide++;renderSlide(curSlide);}};
document.getElementById("vqObSkipBtn").onclick=window.finishOnboarding;
document.querySelectorAll(".vq-ob-dot").forEach(function(dot){dot.onclick=function(){var idx=parseInt(dot.getAttribute("data-i"));if(!isNaN(idx)){curSlide=idx;renderSlide(idx);}};});
renderSlide(0);
})();
</script>
