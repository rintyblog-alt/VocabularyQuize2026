<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>VocabuQuiz V3 — The new flow of learning</title>
<link rel="stylesheet" href="ad.css">
<link rel="stylesheet" href="timeline.css">
<link rel="stylesheet" href="scenes-a.css">
<link rel="stylesheet" href="scenes-b.css">
<link rel="stylesheet" href="finale.css">
<link rel="stylesheet" href="film.css">
<script>
/* ══════════════════════════════════════════════════════════════════
   VQAD 共通ランタイム（契約は DESIGN.md §2）
   すべてのモジュールより先に読まれる。ここを書き換えるのは統合者だけ。
   ══════════════════════════════════════════════════════════════════ */
(function () {
  "use strict";
  /* 種固定の乱数（mulberry32）。録画の再現性のため Math.random は使わない。 */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var seed = 20260804;
  var rng = mulberry32(seed);

  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  var ease = {
    inOut: function (t) { t = clamp01(t); return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; },
    out: function (t) { t = clamp01(t); return 1 - Math.pow(1 - t, 3); },
    outBack: function (t) {
      t = clamp01(t);
      var c1 = 1.70158, c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    }
  };
  /* local 秒が start..end のどこか → 0..1（外側は張り付き） */
  function span(local, start, end) { return clamp01((local - start) / Math.max(0.0001, end - start)); }
  /* 通過した閾値ごとに beat-N クラスを付け外しする（冪等） */
  function beats(rootEl, local, thresholds) {
    for (var i = 0; i < thresholds.length; i++) {
      rootEl.classList.toggle("beat-" + i, local >= thresholds[i]);
    }
  }

  /* 文字を 1 文字ずつの span へ割る（キネティックタイポ用）。
     build で 1 回だけ呼び、update では kinPose で位置を決める。 */
  function kinSplit(node, text) {
    node.textContent = "";
    var spans = [];
    for (var i = 0; i < text.length; i++) {
      var sp = document.createElement("span");
      sp.className = "vqad-kin";
      sp.textContent = text.charAt(i);
      node.appendChild(sp);
      spans.push(sp);
    }
    return spans;
  }
  /* 1 文字ずつ「下からぼかし解除」で入り、まとめて抜ける。
     local 秒の純関数なので seek しても同じ絵になる。 */
  function kinPose(spans, local, tIn, tOut, stagger) {
    var st = stagger == null ? 0.028 : stagger;
    var outK = ease.inOut(span(local, tOut - 0.55, tOut));
    for (var i = 0; i < spans.length; i++) {
      var e = ease.out(span(local, tIn + i * st, tIn + i * st + 0.52));
      /* 出かかりを **速く薄く** する。線形だと「うっすら見えている時間」が長く、
         画数の多い漢字（験・練など）はその間ずっと灰色の塊に見える。
         e^1.6 にすると、字形が立つ直前まで実質不可視になる。 */
      var o = Math.pow(e, 1.6) * (1 - outK);
      var sp = spans[i];
      sp.style.opacity = o.toFixed(3);
      sp.style.transform = "translateY(" + ((1 - e) * 20 - outK * 12).toFixed(2) + "px)"
        + " scale(" + (0.96 + 0.04 * e).toFixed(3) + ")";
      /* ぼかしは 1.5px まで。3px でも、薄い状態の濃い漢字は面積だけが残って
         四角く潰れた（実測 41s の「験」= 不透明度 0.057 / ぼかし 2.83px）。
         さらに **ほぼ見えない間はぼかしを掛けない**（掛けても滲みしか出ない）。 */
      var b = o < 0.12 ? 0 : 1.5 * (1 - e) + 1.6 * outK;
      sp.style.filter = b < 0.05 ? "" : "blur(" + b.toFixed(2) + "px)";
    }
    return outK < 1 && local >= tIn - 0.2;
  }

  window.VQAD = {
    rng: rng,
    kinSplit: kinSplit, kinPose: kinPose,
    reseed: function () { rng = mulberry32(seed); window.VQAD.rng = rng; },
    clamp01: clamp01, lerp: lerp, ease: ease, span: span, beats: beats,
    sceneDefs: [],
    config: {
      DURATION: 90,
      CROSSFADE: 1.2,
      SCENES: [
        { id: "s1", order: 1, start: 0,  end: 10, mood: "calm",    title: "Opening" },
        { id: "s2", order: 2, start: 10, end: 22, mood: "presets", title: "プリセット" },
        { id: "s3", order: 3, start: 22, end: 38, mood: "mock",    title: "Quick Mock" },
        { id: "s4", order: 4, start: 38, end: 50, mood: "player",  title: "プレイヤー" },
        { id: "s5", order: 5, start: 50, end: 68, mood: "speak",   title: "VocabuSpeak" },
        { id: "s6", order: 6, start: 68, end: 78, mood: "insight", title: "Insight" },
        { id: "s7", order: 7, start: 78, end: 90, mood: "finale",  title: "Finale" }
      ]
    },
    space: null,
    timeline: null
  };
})();
</script>
</head>
<body>
  <!-- 宇宙背景（遠景=星と星雲 / 近景=流線と粒子） -->
  <canvas id="vqad-far" class="vqad-canvas" aria-hidden="true"></canvas>
  <canvas id="vqad-near" class="vqad-canvas" aria-hidden="true"></canvas>

  <!-- シーンの舞台。main.js が sceneDefs から <section> を生やす -->
  <div id="vqad-stage" aria-label="VocabuQuiz V3 プロモーション"></div>

  <!-- フィルム層（粒子・周辺減光・色収差・光条）。stage の上、コントロールの下 -->
  <canvas id="vqad-film" class="vqad-canvas" aria-hidden="true"></canvas>

  <!-- 再生コントロール（timeline.js が構築。record モードでは空のまま） -->
  <div id="vqad-controls"></div>

  <!-- 開始オーバーレイ（main.js が制御） -->
  <div id="vqad-start" class="vqad-start" role="button" tabindex="0" aria-label="再生">
    <div class="vqad-start-inner">
      <div class="vqad-start-kicker">VocabuQuiz</div>
      <div class="vqad-start-v3">V3</div>
      <div class="vqad-start-play">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
          <path d="M8 5.5v13l11-6.5z" fill="currentColor"/>
        </svg>
        <span>再生する</span>
      </div>
      <div class="vqad-start-sub">60–90 秒のシネマティックプレビュー</div>
    </div>
  </div>

  <script src="space.js"></script>
  <script src="timeline.js"></script>
  <script src="scenes-a.js"></script>
  <script src="scenes-b.js"></script>
  <script src="finale.js"></script>
  <script src="film.js"></script>
  <script src="main.js"></script>
</body>
</html>
