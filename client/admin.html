<!-- ══ ログイン ══════════════════════════════════════════════════════ -->
<div id="scLogin" class="min-h-screen flex items-center justify-center px-6" hidden>
  <div class="w-full max-w-md bg-white rounded-xl border border-slate-200 p-6 shadow-sm leading-normal">
    <h1 class="text-3xl font-bold text-slate-900 mb-1">VocabuQuiz Admin</h1>

    <div id="loginAlert" class="mb-4" hidden></div>
    <form id="loginForm" class="space-y-4">
      <div class="leading-normal">
        <label for="loginEmail" class="block text-sm font-medium text-slate-700 mb-1.5">メールアドレス</label>
        <input id="loginEmail" type="email" autocomplete="username" required
               class="w-full px-3 py-2 text-base border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500/50 caret-primary-500">
      </div>
      <div class="leading-normal">
        <label for="loginPass" class="block text-sm font-medium text-slate-700 mb-1.5">パスワード</label>
        <input id="loginPass" type="password" autocomplete="current-password" required
               class="w-full px-3 py-2 text-base border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500/50 caret-primary-500">
      </div>
      <button type="submit"
              class="w-full inline-flex items-center justify-center gap-2 h-12 px-6 text-[1rem] font-medium bg-primary-500 text-white rounded-lg hover:bg-primary-700 cursor-pointer">ログイン</button>
    </form>
    <div class="mt-6 pt-4 border-t border-slate-200">
      <button id="btnShowBootstrap" type="button" class="text-sm text-slate-500 hover:text-slate-700 cursor-pointer">はじめての owner を設定する</button>
      <form id="bootstrapForm" class="space-y-4 mt-4" hidden>
        <div class="leading-normal">
          <label for="bsEmail" class="block text-sm font-medium text-slate-700 mb-1.5">owner のメールアドレス</label>
          <input id="bsEmail" type="email" class="w-full px-3 py-2 text-base border border-slate-300 rounded-lg">
        </div>
        <div class="leading-normal">
          <label for="bsToken" class="block text-sm font-medium text-slate-700 mb-1.5">設定用トークン（設定済みの場合のみ）</label>
          <input id="bsToken" type="password" class="w-full px-3 py-2 text-base border border-slate-300 rounded-lg">
        </div>
        <div class="leading-normal">
          <label for="bsPass" class="block text-sm font-medium text-slate-700 mb-1.5">決めるパスワード（12 文字以上）</label>
          <input id="bsPass" type="password" class="w-full px-3 py-2 text-base border border-slate-300 rounded-lg">
        </div>
        <button type="submit" class="inline-flex items-center justify-center gap-2 h-10 px-4 text-[1rem] font-medium bg-white text-slate-700 border border-slate-200 rounded-lg hover:bg-gray-50 cursor-pointer">設定する</button>
      </form>
    </div>
  </div>
</div>

<!-- ══ 二要素認証 ════════════════════════════════════════════════════ -->
<div id="scTotp" class="min-h-screen flex items-center justify-center px-6" hidden>
  <div class="w-full max-w-md bg-white rounded-xl border border-slate-200 p-6 shadow-sm leading-normal">
    <h1 class="text-3xl font-bold text-slate-900 mb-1">二要素認証</h1>
    <p class="text-sm text-slate-500 mb-6" id="totpLead">認証アプリのコードを入れてください。</p>
    <div id="totpAlert" class="mb-4" hidden></div>
    <div id="totpSetupBox" class="mb-5" hidden>
      <div class="flex items-start gap-3 p-4 bg-primary-50 border border-primary-200 text-primary-800 rounded-lg mb-4 lead">
        <span class="text-sm">認証アプリ（Google Authenticator・1Password・iPhone の「パスワード」など）に下の鍵を登録すると、6 桁のコードが出ます。スマホなら下のリンクを押すだけで渡せます。QR は出していません（外部の部品を読み込まないため）。<b>この画面を読み直すと登録し直しになるので、登録し終えるまで閉じないでください。</b></span>
      </div>
      <div class="leading-normal">
        <label class="block text-sm font-medium text-slate-700 mb-1.5">鍵（Base32）</label>
        <code id="totpSecret" class="block px-3 py-2 text-sm bg-gray-50 border border-slate-200 rounded-lg break-all"></code>
      </div>
      <div class="leading-normal mt-3">
        <label class="block text-sm font-medium text-slate-700 mb-1.5">otpauth URL</label>
        <code id="totpUrl" class="block px-3 py-2 text-xs bg-gray-50 border border-slate-200 rounded-lg break-all"></code>
      </div>
    </div>
    <form id="totpForm" class="space-y-4">
      <div class="leading-normal">
        <label for="totpCode" class="block text-sm font-medium text-slate-700 mb-1.5">6 桁のコード</label>
        <input id="totpCode" inputmode="numeric" maxlength="6" required

      </div>
      <button type="submit" class="w-full inline-flex items-center justify-center gap-2 h-12 px-6 text-[1rem] font-medium bg-primary-500 text-white rounded-lg hover:bg-primary-700 cursor-pointer">確認する</button>
    </form>
  </div>
</div>

<style id="admin-mobile">
/* ══ スマホでの 手直し（2026-09-05）══════════════════════════════════
   訴え「アドミンを モバイルにも 最適化させて」

   ★ 骨組み（引き出し・全幅）は Tailwind の max-md: で 当てて いる。
     ここは **指で 押せる 大きさ**と、狭い 幅で 溢れる ものだけ。
   実測（390px）で 出て いた もの:
     ・押しどころが 32px（指の 目安 44px に 足りない）
     ・チェックボックスが 16px
     ・横に 3 つ 並べた 入力が 潰れる
   ══════════════════════════════════════════════════════════════════ */
@media (max-width: 767px) {
  /* 押しどころは 44px 以上。上部の ハンバーガーは もともと 44px。 */
  #scApp button, #scApp a[href], #scApp select, #scApp input:not([type="checkbox"]):not([type="radio"]) {
    min-height: 44px;
  }
  /* チェックボックスは そのままだと 16px。指で 押せる 大きさに して、
     ラベルごと 押せる ように 高さを 持たせる。 */
  #scApp input[type="checkbox"], #scApp input[type="radio"] { width: 20px; height: 20px; }
  #scApp label { min-height: 44px; display: flex; align-items: center; gap: 8px; }
  #scApp label.block, #scApp label[for] { min-height: 0; display: block; }
  /* 横並びの 入力は 縦に する（3 つ 並べると 1 つ 90px しか 無い）。 */
  #scApp .flex.flex-wrap.items-end { flex-direction: column; align-items: stretch; gap: 12px; }
  #scApp .flex.flex-wrap.items-end > div,
  #scApp .flex.flex-wrap.items-end > button { width: 100%; }
  #scApp .flex.flex-wrap.items-end input,
  #scApp .flex.flex-wrap.items-end select { width: 100%; }
  /* ══ 表 ═══════════════════════════════════════════════════════
     ★ 表は **器の 中で 横に すべる**。縦に 潰さない。
       min-width を 520px に して いた ときは 列が 5 つ 以上 あると
       1 文字ずつ 折り返して いた（実測: "H2-ncmtn7uq…" が 縦 1 列）。
     ★ セルは 折り返さない。読みたい ものは 横に すべって 見る。 */
  #scApp table { min-width: 760px; }
  #scApp th, #scApp td { white-space: nowrap; }
  /* 札（状態・役割）も 縦に 潰さない。 */
  #scApp td span { white-space: nowrap; }
  /* 2 カラムの 並びは 1 本に。 */
  #scApp .grid.md\:grid-cols-2 { grid-template-columns: 1fr; }
  /* 長い URL などで 横に 伸びない（表の 外の 文だけ）。 */
  #scApp .lead, #scApp p { word-break: break-word; }
}
</style>
<div id="scApp" class="flex h-screen" hidden>

<div id="reauthWrap" class="fixed inset-0 z-50 bg-slate-900/40 flex items-center justify-center px-6" hidden>
  <div class="w-full max-w-md bg-white rounded-xl border border-slate-200 p-6 shadow-xl leading-normal" role="dialog" aria-modal="true" aria-labelledby="reauthTitle">

    <p class="text-sm text-slate-500 mb-5 lead">この操作は取り消しの効きにくいものです。パスワードか認証アプリのコードを入れてください。</p>
    <div id="reauthAlert" class="mb-4" hidden></div>
    <form id="reauthForm" class="space-y-4">
      <div class="leading-normal">
        <label for="reauthPass" class="block text-sm font-medium text-slate-700 mb-1.5">パスワード</label>
        <input id="reauthPass" type="password" class="w-full px-3 py-2 text-base border border-slate-300 rounded-lg">

      <div class="leading-normal">
        <label for="reauthCode" class="block text-sm font-medium text-slate-700 mb-1.5">または 6 桁のコード</label>
        <input id="reauthCode" inputmode="numeric" maxlength="6" class="w-full px-3 py-2 text-base border border-slate-300 rounded-lg">
      </div>
      <div class="flex gap-3">
        <button type="submit" class="inline-flex items-center justify-center gap-2 h-10 px-4 text-[1rem] font-medium bg-primary-500 text-white rounded-lg hover:bg-primary-700 cursor-pointer">確認する</button>
        <button type="button" id="reauthCancel" class="inline-flex items-center justify-center gap-2 h-10 px-4 text-[1rem] font-medium bg-white text-slate-700 border border-slate-200 rounded-lg hover:bg-gray-50 cursor-pointer">やめる</button>
      </div>
    </form>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   VocabuQuiz Admin — 画面（2026-08-18）

   ★ ここでボタンを隠すのは **飾り**であって、権限制御ではない。
     権限はすべてサーバ（/api/admin/*）で確かめている。
     ここでの出し分けは「押せないものを見せない」ための親切にすぎない。
   ★ 生成物の中身は、そもそも API から返ってこない。ここでも出さない。
   ══════════════════════════════════════════════════════════════════════ */
(function () {
  "use strict";
  var ME = null;
  var REASONS = [];

  /* ── 小道具 ─────────────────────────────────────────────────────── */
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s === undefined || s === null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function num(v) { var n = Number(v); return Number.isFinite(n) ? n : 0; }
  function fmt(n) { return num(n).toLocaleString("ja-JP"); }
  function bytes(b) {
    b = num(b);
    if (b < 1024) return b + " B";
    if (b < 1024 * 1024) return (b / 1024).toFixed(1) + " KB";
    if (b < 1024 * 1024 * 1024) return (b / 1024 / 1024).toFixed(1) + " MB";
    return (b / 1024 / 1024 / 1024).toFixed(2) + " GB";
  }
  function when(v) {
    if (!v) return "—";
    var d = typeof v === "number" ? new Date(v) : new Date(String(v));
    if (isNaN(d.getTime())) return "—";
    return d.toLocaleString("ja-JP", { timeZone: "Asia/Tokyo" });
  }
  function alertBox(kind, text) {
    var m = {
      info: "bg-primary-50 border-primary-200 text-primary-800",
      ok: "bg-emerald-50 border-emerald-200 text-emerald-800",
      warn: "bg-amber-50 border-amber-200 text-amber-800",
      err: "bg-red-50 border-red-200 text-red-800"
    };
    return '<div class="flex items-start gap-3 p-4 ' + m[kind] + ' border rounded-lg lead">'
      + '<span class="text-sm">' + esc(text) + "</span></div>";
  }
  function show(el, html, kind) {
    if (!html) { el.hidden = true; el.innerHTML = ""; return; }
    el.innerHTML = alertBox(kind || "err", html);
    el.hidden = false;
  }
  function badge(text, tone) {
    var t = {
      slate: "bg-slate-100 text-slate-700", green: "bg-emerald-100 text-emerald-800",
      amber: "bg-amber-100 text-amber-800", red: "bg-red-100 text-red-800",
      blue: "bg-primary-100 text-primary-800"
    }[tone || "slate"];
    return '<span class="' + t + ' px-3 py-1 rounded-full text-xs font-medium">' + esc(text) + "</span>";
  }
  function card(inner, cls) {
    return '<div class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm ' + (cls || "") + '">' + inner + "</div>";
  }
  function h2(t) { return '<h2 class="text-xl font-bold text-slate-900 leading-normal mb-4">' + esc(t) + "</h2>"; }
  function empty(t) { return '<div class="text-base text-slate-500 text-center py-16 lead">' + esc(t) + "</div>"; }
  function table(headers, rows) {
    if (!rows.length) return empty("表示するものがありません。");
    return '<div class="bg-white rounded-xl border border-slate-200 overflow-hidden">'
      + '<div class="overflow-x-auto"><table class="w-full">'
      + '<thead><tr class="border-b border-slate-200 bg-gray-50">'
      + headers.map(function (h) {
          return '<th scope="col" class="text-left py-3 px-4 text-xs font-medium text-slate-500 uppercase tracking-wider whitespace-nowrap">' + esc(h) + "</th>";
        }).join("")
      + "</tr></thead><tbody>"
      + rows.map(function (r) {
          return '<tr class="hover:bg-gray-50 transition-colors border-b border-slate-100 last:border-0">'
            + r.map(function (c) { return '<td class="py-3 px-4 text-sm align-top">' + c + "</td>"; }).join("")
            + "</tr>";
        }).join("")
      + "</tbody></table></div></div>";
  }

  /* ── API ────────────────────────────────────────────────────────── */
  var pendingRetry = null;
  function api(path, opts) {
    opts = opts || {};
    var init = { method: opts.method || "GET", credentials: "same-origin", headers: {} };
    if (init.method !== "GET") {
      init.headers["Content-Type"] = "application/json";
      /* 別サイトからは付けられないヘッダ。CSRF よけ。 */
      init.headers["X-VQ-Admin"] = "1";
      init.body = JSON.stringify(opts.body || {});
    }
    return fetch("/api/admin/" + path, init).then(function (r) {
      return r.json().catch(function () { return { ok: false, code: "BAD_JSON" }; })
        .then(function (j) { j.__status = r.status; return j; });
    });
  }
  /* 壊す操作は、断られたら **再認証を出してからもう一度**。 */
  function apiGuarded(path, opts) {
    return api(path, opts).then(function (j) {
      if (j && j.code === "REAUTH_REQUIRED") {
        return askReauth().then(function (okd) {
          if (!okd) return { ok: false, code: "CANCELLED", message: "やめました。" };
          return api(path, opts);
        });
      }
      return j;
    });
  }
  function askReauth() {
    return new Promise(function (resolve) {
      pendingRetry = resolve;
      $("reauthPass").value = ""; $("reauthCode").value = "";
      $("reauthAlert").hidden = true;
      $("reauthWrap").hidden = false;
      $("reauthPass").focus();
    });
  }
  $("reauthCancel").addEventListener("click", function () {
    $("reauthWrap").hidden = true;
    if (pendingRetry) { pendingRetry(false); pendingRetry = null; }
  });
  $("reauthForm").addEventListener("submit", function (e) {
    e.preventDefault();
    api("auth/reauth", { method: "POST", body: { password: $("reauthPass").value, code: $("reauthCode").value } })
      .then(function (j) {
        if (!j.ok) { show($("reauthAlert"), j.message || "確認できませんでした。"); return; }
        $("reauthWrap").hidden = true;
        if (pendingRetry) { pendingRetry(true); pendingRetry = null; }
      });
  });

  /* ── 画面の一覧。**ここに載せたものは必ずナビから行ける。** ────── */
  var PAGES = [
    { key: "dashboard", path: "/admin", label: "ダッシュボード", perm: "metrics.view",
      lead: "対処が要るものだけを上に出しています。" },
    { key: "users", path: "/admin/users", label: "ユーザー管理", perm: "users.view",
      lead: "メールアドレスは既定でマスクしています。展開すると監査ログに残ります。" },
    { key: "admins", path: "/admin/admins", label: "管理者管理", perm: "admins.view",
      lead: "owner は常に 1 人以上いる必要があります。" },
    { key: "providers", path: "/admin/providers", label: "AI消費とレート制限", perm: "metrics.view",
      lead: "実運用でいちばん見る画面です。上限値はこの画面から変えられます。" },
    { key: "lumi", path: "/admin/lumi", label: "Lumi稼働率と利用制限", perm: "metrics.view",
      lead: "制限の変更はデプロイなしで効きます（30 秒以内）。" },
    { key: "calls", path: "/admin/calls", label: "通話", perm: "metrics.view",
      lead: "件数と時間だけです。通話の音声は保存していないので、内容は出せません。" },
    { key: "flags", path: "/admin/flags", label: "機能フラグ", perm: "flags.view",
      lead: "左サイドパネルはこの表から描かれます。off にすると URL 直打ちでも入れません。" },
    { key: "quality", path: "/admin/quality", label: "生成品質", perm: "metrics.view",
      lead: "エラーコードと件数だけです。生成物の中身は出しません。" },
    { key: "storage", path: "/admin/storage", label: "ストレージ", perm: "metrics.view",
      lead: "件数と容量だけです。ファイル名も中身も出しません。" },
    { key: "content", path: "/admin/content", label: "コンテンツ管理", perm: "content.view",
      lead: "中身の確認は、確認画面を挟んだうえで監査ログに残ります。" },

  /* ══ お知らせに 添える 画像・動画（2026-08-20）════════════════════

       （admin.js は 本体から 差してもらった 口を 呼ぶだけ）。
     ★ 持ち主は VocabuQuiz 公式。 */
  var AN_MEDIA = [];
  function anPaintMedia() {
    var box = $("anMedia"); if (!box) return;
    box.innerHTML = AN_MEDIA.map(function (m, i) {
      var 中 = m.kind === "video"
        ? '<video src="' + esc(m.url) + '" muted playsinline preload="metadata" class="w-full h-full object-cover"></video>'
        : '<img src="' + esc(m.url) + '" alt="" class="w-full h-full object-cover">';
      return '<div class="relative w-28 h-28 rounded-xl border border-slate-200 overflow-hidden bg-gray-50">'
        + 中
        + '<button type="button" data-act="androp" data-i="' + i + '" aria-label="外す"'
        + ' class="absolute top-1 right-1 w-7 h-7 inline-flex items-center justify-center rounded-full bg-white/90 border border-slate-200 text-slate-700 cursor-pointer">'
        + '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>'
        + "</button>"
        + '<span class="absolute bottom-0 left-0 right-0 text-[10px] text-white bg-black/50 px-1 py-0.5 truncate">'
        + esc(m.kind === "video" ? "動画" : "画像") + "</span></div>";
    }).join("");
  }
  function anUpload(files) {
    var msg = $("anUpMsg");
    var list = Array.prototype.slice.call(files || []);
    if (!list.length) return;
    if (AN_MEDIA.length + list.length > 8) {
      if (msg) msg.textContent = "8 つまでです。";
      list = list.slice(0, Math.max(0, 8 - AN_MEDIA.length));
      if (!list.length) return;
    }
    var 済 = 0;
    var 次 = function () {
      if (!list.length) {
        if (msg) msg.textContent = 済 ? (済 + " 件 あげました。") : "";
        anPaintMedia();
        return;
      }
      var f = list.shift();
      if (msg) msg.textContent = "あげています… " + (f.name || "");
      fetch("/api/admin/upload", {
        method: "POST",
        headers: {
          "x-vq-admin": "1",
          "content-type": f.type || "application/octet-stream",
          "x-file-name": encodeURIComponent(f.name || "file")
        },
        body: f,
        credentials: "same-origin"
      }).then(function (r) { return r.json().catch(function () { return {}; }); })
        .then(function (j) {
          if (!j || !j.ok || !j.url) {
            if (msg) msg.textContent = (j && j.message) || "あげられませんでした。";
            anPaintMedia();
            return;
          }
          AN_MEDIA.push({ kind: j.kind === "video" ? "video" : "image", url: j.url,
                          name: String(f.name || ""), bytes: Number(j.bytes || 0) });
          済++;
          anPaintMedia();
          次();
        }).catch(function () {
          if (msg) msg.textContent = "あげられませんでした。";
        });
    };
    次();
  }
  /* ══ 表紙のバナー（2026-09-03）═══════════════════════════════════
     ★ あげ先は 添えものと **同じ口**（/api/admin/upload）。

     ★ 表紙に できるのは **画像だけ**。動画を あげられても 表紙に しない。 */
  function anPaintCover() {
    var box = $("anCoverPrev"); if (!box) return;
    var v = $("anCover") ? String($("anCover").value || "").trim() : "";
    var 通る = /^\/api\/media\/img\/[A-Za-z0-9._-]+$/.test(v) || /^https?:\/\//i.test(v);
    box.innerHTML = 通る
      ? '<div class="w-full max-w-md rounded-xl border border-slate-200 overflow-hidden bg-gray-50" style="aspect-ratio:1200/630">'
        + '<img src="' + esc(v) + '" alt="表紙のバナー" class="w-full h-full object-cover"></div>'
      : "";
  }
  function anUploadCover(file) {
    var msg = $("anCoverMsg");
    if (!file) return;
    if (msg) msg.textContent = "あげています… " + (file.name || "");
    fetch("/api/admin/upload", {
      method: "POST",
      headers: {
        "x-vq-admin": "1",
        "content-type": file.type || "application/octet-stream",
        "x-file-name": encodeURIComponent(file.name || "file")
      },
      body: file,
      credentials: "same-origin"
    }).then(function (r) { return r.json().catch(function () { return {}; }); })
      .then(function (j) {
        if (!j || !j.ok || !j.url) { if (msg) msg.textContent = (j && j.message) || "あげられませんでした。"; return; }
        if (j.kind !== "image") { if (msg) msg.textContent = "表紙にできるのは画像だけです。"; return; }
        if ($("anCover")) $("anCover").value = j.url;
        if (msg) msg.textContent = "あげました。";
        anPaintCover();
      }).catch(function () { if (msg) msg.textContent = "あげられませんでした。"; });
  }
  document.addEventListener("change", function (e) {

  function pageFor(path) {
    var p = String(path || "/admin").replace(/\/+$/, "") || "/admin";
    for (var i = PAGES.length - 1; i >= 0; i--) if (PAGES[i].path === p) return PAGES[i];
    return PAGES[0];
  }
  function go(path, replace) {
    if (replace) history.replaceState({}, "", path); else history.pushState({}, "", path);
    draw();
  }
  function draw() {
    var p = pageFor(location.pathname);
    buildNav(p.key);
    $("pageTitle").textContent = p.label;
    if ($("mbTitle")) $("mbTitle").textContent = p.label;   /* スマホの 上部バー */
    $("pageLead").textContent = p.lead;
    $("pageAlert").hidden = true;
    $("pageBody").innerHTML = '<div class="text-base text-slate-500 text-center py-16 lead">読み込んでいます…</div>';
    if (!can(p.perm)) {
      $("pageBody").innerHTML = alertBox("warn", "この画面を見る権限がありません（必要: " + p.perm + "）。");
      return;
    }
    RENDER[p.key]().then(function (html) { $("pageBody").innerHTML = html; })
      .catch(function (e) { $("pageBody").innerHTML = alertBox("err", "読み込みに失敗しました。" + e.message); });

  /* ══ スマホ：引き出しの 開け閉め（2026-09-05）══════════════════════
     ・ハンバーガーで 開く／幕を 押すと 閉じる／中の どれかを 押しても 閉じる
     ・幅が 広がったら（横向き・タブレット）**必ず 閉じた 形に 戻す**
       （開いた ままの 印が 残ると PC で 幕が 出っぱなしに なる） */
  function 引き出し(開ける) {
    var side = $("scSide"), bd = $("mbBackdrop");
    if (!side) return;
    if (開ける) {
      side.classList.remove("max-md:-translate-x-full");
      if (bd) bd.hidden = false;
      document.body.style.overflow = "hidden";
    } else {
      side.classList.add("max-md:-translate-x-full");
      if (bd) bd.hidden = true;
      document.body.style.overflow = "";
    }
  }
  (function 引き出しを結ぶ() {
    var m = $("mbMenu"), bd = $("mbBackdrop");
    if (m) m.addEventListener("click", function () { 引き出し(true); });

      } }).then(function (j) {
        if (!j.ok) { $("qdMsg").textContent = j.message || "動かせませんでした。"; return; }
        $("qdMsg").textContent = "動かしました。いまの残高 " + fmt(j.残高) + " Qredit";
        var e = $("qdNow"); if (e) e.textContent = "いまの残高 " + fmt(j.残高) + " Qredit";
      });
    }
    if (act === "qdplan") {
      var pl = $("qdPlan").value;
      var 日 = Number($("qdDays").value || 0);
      var なぜ2 = String($("qdWhy").value || "").trim();
      if (!なぜ2) { $("qdMsg").textContent = "理由を 書いて ください（監査ログに 残ります）。"; return; }
      if (!confirm("プランを " + pl.toUpperCase() + " に します。\n本人にも 知らせが 届きます。よろしいですか。")) return;
      $("qdMsg").textContent = "変えています…";
      return apiGuarded("users/" + encodeURIComponent(id) + "/subscription", { method: "POST", body: {
        planId: pl, days: 日, reasonText: なぜ2, reasonCategory: "other"
      } }).then(function (j) {
        $("qdMsg").textContent = j.ok
          ? ("プランを " + String(j.plan).toUpperCase() + " に しました。")
          : (j.message || "変えられませんでした。");
      });
    }
    if (act === "udinspect") {
      var 箱 = $("udInspect");
      箱.innerHTML = '<div class="text-sm text-slate-500 py-4">読み込んでいます…</div>';
      return api("users/" + encodeURIComponent(id) + "/inspect").then(function (j) {
        if (!j.ok) { 箱.innerHTML = alertBox("err", j.message || "読めませんでした。"); return; }
        var d2 = j.data || {};
        var 節 = function (題, 中) {
          return '<div class="mt-4"><div class="text-xs font-medium text-slate-500 uppercase tracking-wider mb-2">'
            + esc(題) + "</div>" + 中 + "</div>";
        };
        var pre = (d2.presets || []).length
          ? table(["名前", "公開", "更新"], (d2.presets || []).map(function (p2) {
              return [esc(p2.public_title || p2.name || "（名前なし）"),
                      p2.is_public ? badge("公開", "green") : badge("非公開", "gray"),
                      when(p2.updated_at)];
            }))
          : empty("プリセットは ありません。");
        var jb = (d2.jobs || []).length
          ? table(["種類", "結果", "作った数", "とき"], (d2.jobs || []).map(function (x) {
              return [esc(x.type || "—"),
                      x.error_code ? badge(String(x.error_code), "red") : badge(String(x.status || "—"), "green"),
                      fmt(x.made_count) + " / " + fmt(x.planned_count),
                      when(x.created_at)];
            }))
          : empty("生成の記録は ありません。");
        var rp = ((d2.通報 && d2.通報.された) || []).length
          ? table(["対象", "理由", "状態", "とき"], d2.通報.された.map(function (x) {
              return [esc(x.target_type || "—"), esc(x.reason || "—"),
                      badge(String(x.state || "—"), x.state === "open" ? "amber" : "gray"), when(x.created_at)];
            }))
          : empty("通報は ありません。");
        var nt = (d2.通知 || []).length
          ? table(["種類", "見出し", "とき"], (d2.通知 || []).map(function (x) {
              return [esc(x.type || "—"), esc(x.title || "—"), when(x.ts)];
            }))
          : empty("通知は ありません。");
        箱.innerHTML = 節("プリセット（" + (d2.presets || []).length + "）", pre)
          + 節("生成の記録（直近 30）", jb)
          + 節("通報された（" + ((d2.通報 && d2.通報.された) || []).length + "）", rp)
          + 節("届いた通知（直近 20）", nt);
      });
    }

    /* ══ 通知を 送る（2026-09-05）══════════════════════════════════ */
    if (act === "nfcount") {
      var to0 = $("nfTo").value;
      $("nfCount").textContent = "数えています…";
      return api("notify/count", { method: "POST", body: {
        to: to0, userId: Number($("nfUid").value || 0), days: Number($("nfDays").value || 7)
      } }).then(function (j) {
        $("nfCount").textContent = j.ok ? ("→ " + j.人数 + " 人に 届きます") : (j.message || "数えられません");
      });
    }
    if (act === "nfsend") {
      var to = $("nfTo").value;
      var 題 = String($("nfTitle").value || "").trim();
      var 文 = String($("nfBody").value || "").trim();
      var 理 = String($("nfReason").value || "").trim();
      if (!題 || !文) { $("nfMsg").textContent = "見出しと 本文を 書いて ください。"; return; }
      if (!理) { $("nfMsg").textContent = "送る理由を 書いて ください（監査ログに 残ります）。"; return; }
      var 相手 = to === "user" ? ("ID " + $("nfUid").value + " の 人")
        : to === "all" ? "全員"
        : ($("nfDays").value + " 日" + (to === "active" ? " 以内に 開いた 人" : " 開いて いない 人"));
      if (!confirm(相手 + " へ 通知を 送ります。\n\n" + 題 + "\n\n送ったら 取り消せません。よろしいですか。")) return;
      $("nfMsg").textContent = "送っています…";
      return apiGuarded("notify/send", { method: "POST", body: {
        to: to, userId: Number($("nfUid").value || 0), days: Number($("nfDays").value || 7),
        title: 題, body: 文, reasonText: 理, reasonCategory: "other"
      } }).then(function (j) {
        if (!j.ok) { $("nfMsg").textContent = j.message || "送れませんでした。"; return; }
        $("nfMsg").textContent = "送りました。" + j.送った + " 人に 入りました（" + j.宛先 + "）"
          + (j.打ち切り ? "。※ 上限で 打ち切りました" : "");
        $("nfTitle").value = ""; $("nfBody").value = ""; $("nfReason").value = "";
      });
    }
    if (act === "anpick") { if ($("anFile")) $("anFile").click(); return; }
    if (act === "ancoverpick") { if ($("anCoverFile")) $("anCoverFile").click(); return; }
    if (act === "ancoverdrop") {
      if ($("anCover")) $("anCover").value = "";
      if ($("anCoverMsg")) $("anCoverMsg").textContent = "";
      anPaintCover();
      return;
    }
    if (act === "androp") {
      AN_MEDIA.splice(Number(t.getAttribute("data-i")) || 0, 1);
      anPaintMedia();
      return;
    }
    /* ★ 長い お知らせを **手で 打たない** ための 口（2026-09-02）。
       {title, summary, body, category, coverUrl} の JSON を 貼ると 欄が 埋まる。
       貼るだけで、配信は これまで どおり 人が 押す。 */
    if (act === "anload") {
      var 生 = window.prompt("お知らせの JSON を貼ってください（title / summary / body / category / coverUrl）");
      if (!生) return;
      var o = null;
      try { o = JSON.parse(生); } catch (e) { show($("pageAlert"), "JSON として読めませんでした。"); return; }
      if (!o || typeof o !== "object") { show($("pageAlert"), "JSON として読めませんでした。"); return; }
      var 入 = function (id, v) { var e = $(id); if (e && v != null) e.value = String(v); };
      入("anTitle", o.title);
      入("anBody", o.body != null ? o.body : o.bodyMd);
      入("anSum", o.summary);
      入("anCover", o.coverUrl);
      anPaintCover();
      if (o.category && $("anCat")) $("anCat").value = String(o.category);
      show($("pageAlert"), "読み込みました。中身を確かめてから配信してください。", "ok");
      return;
    }
    if (act === "ansave") {
      apiGuarded("announcements", { method: "POST", body: {
        title: $("anTitle").value, bodyMd: $("anBody").value,
        coverUrl: $("anCover") ? $("anCover").value.trim() : "",
        summary: $("anSum") ? $("anSum").value.trim() : "",
        channel: $("anCh").value, category: $("anCat").value,
        publishedAt: $("anPub").value ? new Date($("anPub").value).toISOString() : "",
        expiresAt: $("anExp").value ? new Date($("anExp").value).toISOString() : "",
        media: AN_MEDIA,
        notify: $("anNotify") ? $("anNotify").checked : false,
        status: op, reason: "画面から" + (op === "published" ? "配信" : "保存")
      } }).then(function (j) {
        if (!j.ok) { show($("pageAlert"), j.message); return; }
        var 文 = op === "published"
          ? ("配信しました。公式サイトのニュースと Feed に入ります。"
             + (j["添えもの"] ? "　画像・動画 " + j["添えもの"] + " 件。" : "")
             + (j["通知を入れた"] ? "　通知を " + fmt(j["通知を入れた"]) + " 人へ 送りました。" : ""))
          : "下書きを保存しました。";
        AN_MEDIA = [];
        show($("pageAlert"), 文, "ok");
        draw();
      });
    }
    if (act === "anarchive") {
      apiGuarded("announcements", { method: "POST", body: { id: id, status: "archived", reason: "画面からアーカイブ" } })
        .then(function (j) { if (j.ok) draw(); else show($("pageAlert"), j.message); });
    }
    if (act === "ausearch") {
      var aq = new URLSearchParams();
      if ($("auAdm").value) aq.set("adminId", $("auAdm").value);
      if ($("auAct").value) aq.set("action", $("auAct").value);
      if ($("auFrom").value) aq.set("from", $("auFrom").value);
      if ($("auTo").value) aq.set("to", $("auTo").value);
      go("/admin/audit?" + aq.toString());
    }
  });

  /* ── ログイン画面 ───────────────────────────────────────────────── */
  $("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    api("auth/login", { method: "POST", body: { email: $("loginEmail").value, password: $("loginPass").value } })
      .then(function (j) {
        if (!j.ok) { show($("loginAlert"), j.message || "ログインできませんでした。"); return; }
        boot();
      });
  });
  /* 押したら 中身を 写す。手で 打ち写すのは まちがえるし 遅い。 */
  function 写す係(id, 名) {
    var el = $(id); if (!el || el.__写す) return;
    el.__写す = true;
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = 名;
    b.className = "mt-1.5 inline-flex items-center justify-center gap-1.5 h-8 px-3 text-[0.875rem] font-medium bg-white text-slate-700 border border-slate-200 rounded-lg hover:bg-gray-50 cursor-pointer";
    b.addEventListener("click", function () {
      var t = el.textContent || "";
      var 済 = function () { b.textContent = "コピーしました"; setTimeout(function () { b.textContent = 名; }, 1600); };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(t).then(済, function () { 手で写す(t, 済); });
        } else 手で写す(t, 済);
      } catch (e) { 手で写す(t, 済); }
    });
    el.parentNode.appendChild(b);
  }
  function 手で写す(t, 済) {
    try {
      var ta = document.createElement("textarea");
      ta.value = t; ta.style.cssText = "position:fixed;left:-9999px;";
      document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); ta.remove(); 済();
    } catch (e) {}
  }
  $("btnShowBootstrap").addEventListener("click", function () {
    $("bootstrapForm").hidden = !$("bootstrapForm").hidden;
  });
  $("bootstrapForm").addEventListener("submit", function (e) {
    e.preventDefault();
    api("auth/bootstrap", { method: "POST", body: {
      email: $("bsEmail").value, setupToken: $("bsToken").value, password: $("bsPass").value } })
      .then(function (j) {
        show($("loginAlert"), j.ok ? "設定しました。ログインしてください。" : (j.message || "できませんでした。"),
          j.ok ? "ok" : "err");
        if (j.ok) $("bootstrapForm").hidden = true;
      });
  });
  $("totpForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var setup = !$("totpSetupBox").hidden;
    api(setup ? "auth/totp/enable" : "auth/totp/verify", { method: "POST", body: { code: $("totpCode").value } })
      .then(function (j) {
        if (!j.ok) { show($("totpAlert"), j.message || "確認できませんでした。"); return; }
        boot();
      });
  });
  $("btnLogout").addEventListener("click", function () {
    api("auth/logout", { method: "POST", body: {} }).then(function () { location.href = "/admin"; });
  });

  /* ── 起動 ───────────────────────────────────────────────────────── */
  function screen(which) {
    ["scLogin", "scTotp", "scApp"].forEach(function (k) { $(k).hidden = (k !== which); });
  }
  function boot() {
    api("auth/me").then(function (j) {
      if (!j.ok) { screen("scLogin"); return; }
      ME = j.admin;
      ME.allPermissions = j.allPermissions;
      ME.rolePermissions = j.rolePermissions;
      if (ME.needTotp && !ME.totpEnabled) {
        screen("scTotp");
        $("totpLead").textContent = "admin 以上は二要素認証が必須です。まず登録してください。";
        api("auth/totp/setup", { method: "POST", body: {} }).then(function (s) {
          if (!s.ok) { show($("totpAlert"), s.message || "できませんでした。"); return; }
          $("totpSetupBox").hidden = false;
          $("totpSecret").textContent = s.secret;
          /* ★ 押せば 認証アプリへ 渡せるようにする（2026-08-20）。
             字だけ 出しても、手で 打ち写すしか なかった。
             otpauth: は 端末の 認証アプリが 受け取る 決まった形。 */
          var a = document.createElement("a");
          a.href = s.otpauth;
          a.textContent = s.otpauth;
          a.className = "block px-3 py-2 text-xs bg-gray-50 border border-slate-200 rounded-lg break-all text-primary-700 underline";
          $("totpUrl").replaceWith(a);
          a.id = "totpUrl";
          写す係("totpSecret", "鍵をコピー");
          写す係("totpUrl", "認証アプリ用のリンクをコピー");
        });
        return;
      }
      if (ME.needTotp && !ME.totpOk) {
        screen("scTotp");
        $("totpSetupBox").hidden = true;
        $("totpLead").textContent = "認証アプリのコードを入れてください。";
        return;
      }
      screen("scApp");
      $("navWho").textContent = ME.email;
      $("navRole").textContent = ME.role;
      $("navEnv").textContent = location.hostname;
      draw();
    });
  }
  boot();
})();
</script>
</body>
</html>
