<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUMINA — シンプルな毎日を、あなたらしく。</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#F5F2EE',
          ink: '#1F2937',
          'ink-soft': '#374151',
          'ink-mute': '#9CA3AF',
          card: '#FFFFFF',
          line: '#E8E4DE'
        },
        fontFamily: {
          sans: ['Inter', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'sans-serif']
        },
        boxShadow: {
          card: '0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.04)'
        }
      }
    }
  }
</script>
<style>
  body { letter-spacing: 0.01em; }
  .lumina-input {
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .lumina-input:focus {
    outline: none;
    border-color: #1F2937;
    box-shadow: 0 0 0 3px rgba(31,41,55,.06);
  }
  .lumina-btn-primary {
    transition: background .2s ease, transform .12s ease;
  }
  .lumina-btn-primary:hover { background: #111827; }
  .lumina-btn-primary:active { transform: translateY(1px); }
  .lumina-btn-google {
    transition: border-color .15s ease, background .15s ease;
  }
  .lumina-btn-google:hover { border-color: #1F2937; background: #FAFAF7; }
  .lumina-link { transition: color .15s ease; }
  .lumina-link:hover { color: #1F2937; }
  .lumina-divider::before, .lumina-divider::after {
    content: ''; flex: 1; border-top: 1px solid #E8E4DE;
  }
</style>
</head>
<body class="min-h-screen bg-bg font-sans text-ink antialiased">

  <!-- 切替ボタン (デモ用) -->
  <div class="fixed top-4 right-4 z-50 flex gap-2 bg-card border border-line rounded-full p-1 shadow-card">
    <button onclick="showPane('login')" id="tabLogin" class="px-4 py-1.5 text-xs font-medium rounded-full transition bg-ink text-white">ログイン</button>
    <button onclick="showPane('signup')" id="tabSignup" class="px-4 py-1.5 text-xs font-medium rounded-full transition text-ink-soft hover:bg-bg">新規登録</button>
  </div>

  <main class="min-h-screen flex items-center justify-center p-6 sm:p-10">
    <div class="w-full max-w-md">

      <!-- ╔════ LOGIN PANEL ════╗ -->
      <section id="paneLogin" class="bg-card rounded-3xl shadow-card p-10 sm:p-12">
        <!-- Logo -->
        <div class="flex flex-col items-center mb-10">
          <svg width="48" height="20" viewBox="0 0 48 20" fill="none" class="mb-3" aria-hidden="true">
            <path d="M2 14 Q 12 4, 24 10 T 46 6" stroke="#1F2937" stroke-width="1.6" stroke-linecap="round" fill="none"/>
          </svg>
          <h1 class="text-[26px] font-light tracking-[0.4em] text-ink">LUMINA</h1>
          <p class="text-[13px] text-ink-mute mt-2 tracking-wider">シンプルな毎日を、あなたらしく。</p>
        </div>

        <!-- Title -->
        <h2 class="text-[28px] font-medium text-center mb-10 text-ink">ログイン</h2>

        <!-- Form -->
        <form class="space-y-6" onsubmit="event.preventDefault();">
          <!-- Email -->
          <div>
            <label class="block text-[13px] font-medium text-ink-soft mb-2">メールアドレス</label>
            <div class="relative">
              <span class="absolute left-4 top-1/2 -translate-y-1/2 text-ink-mute pointer-events-none">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
              </span>
              <input type="email" placeholder="example@email.com"
                class="lumina-input w-full bg-card border border-line rounded-xl pl-11 pr-4 py-3 text-[15px] text-ink placeholder:text-ink-mute">
            </div>
          </div>

          <!-- Password -->
          <div>
            <label class="block text-[13px] font-medium text-ink-soft mb-2">パスワード</label>
            <div class="relative">
              <span class="absolute left-4 top-1/2 -translate-y-1/2 text-ink-mute pointer-events-none">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </span>
              <input type="password" placeholder="パスワードを入力"
                class="lumina-input w-full bg-card border border-line rounded-xl pl-11 pr-12 py-3 text-[15px] text-ink placeholder:text-ink-mute">
              <button type="button" aria-label="パスワード表示切替" class="absolute right-3 top-1/2 -translate-y-1/2 text-ink-mute hover:text-ink p-1">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <!-- Remember + Forgot -->
          <div class="flex items-center justify-between text-[13px]">
            <label class="flex items-center gap-2 cursor-pointer text-ink-soft">
              <input type="checkbox" class="w-4 h-4 rounded border-line accent-ink">
              ログインしたままにする
            </label>
            <a href="#" class="lumina-link text-ink-mute hover:text-ink">パスワードをお忘れですか？</a>
          </div>

          <!-- Primary CTA -->
          <button type="submit" class="lumina-btn-primary w-full bg-ink text-white py-3.5 rounded-xl text-[15px] font-medium tracking-wide">
            ログイン
          </button>

          <!-- Divider -->
          <div class="lumina-divider flex items-center gap-3 text-[12px] text-ink-mute py-1">または</div>

          <!-- Google -->
          <button type="button" class="lumina-btn-google w-full bg-card border border-line py-3.5 rounded-xl text-[14px] font-medium text-ink-soft flex items-center justify-center gap-3">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/>
            </svg>
            Googleでログイン
          </button>
        </form>

        <!-- Footer link -->
        <p class="text-center text-[13px] text-ink-mute mt-8">
          アカウントをお持ちでないですか？
          <button onclick="showPane('signup')" class="lumina-link underline underline-offset-2 text-ink hover:text-ink ml-1">新規登録</button>
        </p>
      </section>

      <!-- ╔════ SIGNUP PANEL ════╗ -->
      <section id="paneSignup" class="bg-card rounded-3xl shadow-card p-10 sm:p-12 hidden">
        <!-- Logo -->
        <div class="flex flex-col items-center mb-10">
          <svg width="48" height="20" viewBox="0 0 48 20" fill="none" class="mb-3" aria-hidden="true">
            <path d="M2 14 Q 12 4, 24 10 T 46 6" stroke="#1F2937" stroke-width="1.6" stroke-linecap="round" fill="none"/>
          </svg>
          <h1 class="text-[26px] font-light tracking-[0.4em] text-ink">LUMINA</h1>
          <p class="text-[13px] text-ink-mute mt-2 tracking-wider">シンプルな毎日を、あなたらしく。</p>
        </div>

        <h2 class="text-[28px] font-medium text-center mb-10 text-ink">アカウントを作成</h2>

        <form class="space-y-6" onsubmit="event.preventDefault();">
          <!-- Name -->
          <div>
            <label class="block text-[13px] font-medium text-ink-soft mb-2">お名前</label>
            <div class="relative">
              <span class="absolute left-4 top-1/2 -translate-y-1/2 text-ink-mute pointer-events-none">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              </span>
              <input type="text" placeholder="山田 太郎"
                class="lumina-input w-full bg-card border border-line rounded-xl pl-11 pr-4 py-3 text-[15px] text-ink placeholder:text-ink-mute">
            </div>
          </div>

          <!-- Email -->
          <div>
            <label class="block text-[13px] font-medium text-ink-soft mb-2">メールアドレス</label>
            <div class="relative">
              <span class="absolute left-4 top-1/2 -translate-y-1/2 text-ink-mute pointer-events-none">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
              </span>
              <input type="email" placeholder="example@email.com"
                class="lumina-input w-full bg-card border border-line rounded-xl pl-11 pr-4 py-3 text-[15px] text-ink placeholder:text-ink-mute">
            </div>
          </div>

          <!-- Password -->
          <div>
            <label class="block text-[13px] font-medium text-ink-soft mb-2">パスワード</label>
            <div class="relative">
              <span class="absolute left-4 top-1/2 -translate-y-1/2 text-ink-mute pointer-events-none">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </span>
              <input type="password" placeholder="8文字以上の半角英数字"
                class="lumina-input w-full bg-card border border-line rounded-xl pl-11 pr-12 py-3 text-[15px] text-ink placeholder:text-ink-mute">
              <button type="button" aria-label="パスワード表示切替" class="absolute right-3 top-1/2 -translate-y-1/2 text-ink-mute hover:text-ink p-1">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <p class="text-[12px] text-ink-mute mt-2">※ 英字・数字を含む8文字以上で入力してください</p>
          </div>

          <button type="submit" class="lumina-btn-primary w-full bg-ink text-white py-3.5 rounded-xl text-[15px] font-medium tracking-wide">
            アカウントを作成
          </button>

          <div class="lumina-divider flex items-center gap-3 text-[12px] text-ink-mute py-1">または</div>

          <button type="button" class="lumina-btn-google w-full bg-card border border-line py-3.5 rounded-xl text-[14px] font-medium text-ink-soft flex items-center justify-center gap-3">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/>
            </svg>
            Googleで登録
          </button>
        </form>

        <p class="text-center text-[13px] text-ink-mute mt-8">
          すでにアカウントをお持ちですか？
          <button onclick="showPane('login')" class="lumina-link underline underline-offset-2 text-ink hover:text-ink ml-1">ログイン</button>
        </p>
      </section>

    </div>
  </main>

<script>
  function showPane(which) {
    const login = document.getElementById('paneLogin');
    const signup = document.getElementById('paneSignup');
    const tabL = document.getElementById('tabLogin');
    const tabS = document.getElementById('tabSignup');
    if (which === 'login') {
      login.classList.remove('hidden');
      signup.classList.add('hidden');
      tabL.className = 'px-4 py-1.5 text-xs font-medium rounded-full transition bg-ink text-white';
      tabS.className = 'px-4 py-1.5 text-xs font-medium rounded-full transition text-ink-soft hover:bg-bg';
    } else {
      signup.classList.remove('hidden');
      login.classList.add('hidden');
      tabS.className = 'px-4 py-1.5 text-xs font-medium rounded-full transition bg-ink text-white';
      tabL.className = 'px-4 py-1.5 text-xs font-medium rounded-full transition text-ink-soft hover:bg-bg';
    }
  }
</script>
</body>
</html>
